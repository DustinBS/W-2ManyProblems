name: Update Tax Data

on:
  schedule:
    # Run quarterly: Jan, Apr, Jul, Oct — covers the Oct/Nov IRS announcement window
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tax-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install taxcalc pandas numpy requests beautifulsoup4

      - name: Scrape IRS limits (primary)
        run: python scripts/scrape_irs_limits.py

      - name: Generate IRS limits fallback (if scraper produced no changes)
        run: python scripts/generate_irs_limits.py

      - name: Generate tax bracket data
        run: python scripts/generate_tax_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/tax_data.json src/data/irs_limits.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update tax data (automated)" && git push)
